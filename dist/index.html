<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Productos (CRUD) - Versión Producción</title>
    <link rel="stylesheet" href="../css/all.min.css">
    <link rel="stylesheet" href="../css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="table w-75 mx-auto py-4">
        <h3 class="py-2 font-weight-bolder text-center">Sistema de Gestión de Productos</h3>

        <label for="productNameInput">Nombre del Producto:</label>
        <input type="text" oninput="validateProductName()" class="form-control mb-2" id="productNameInput"
            placeholder="Inicia con mayúscula, 4 a 9 letras">
        <div class="invalid-feedback">El nombre debe iniciar con mayúscula y tener entre 4 y 9 letras.</div>

        <label for="productPriceInput">Precio del Producto:</label>
        <input type="number" oninput="validatePrice()" class="form-control mb-2" id="productPriceInput"
            placeholder="El precio debe ser un número positivo">
        <div class="invalid-feedback">Ingrese un precio válido mayor a 0.</div>

        <label for="ProductCategoryInput">Categoría del Producto:</label>
        <input type="text" oninput="validateCategory()" class="form-control mb-2" id="ProductCategoryInput"
            placeholder="La categoría debe tener entre 3 y 15 letras">
        <div class="invalid-feedback">La categoría debe tener entre 3 y 15 caracteres.</div>

        <label for="productDescInput">Descripción del Producto:</label>
        <textarea class="form-control mb-3" id="productDescInput" placeholder="Descripción opcional..."></textarea>

        <button id="addBtn" onclick="addProduct();" class="btn btn-outline-info">Agregar Producto</button>
        <button id="updateBtn" onclick="updateProduct();" class="btn btn-outline-primary d-none">Actualizar Producto</button>
    </div>

    <div class="w-75 mx-auto p-4">
        <label for="search">Buscar:</label>
        <input type="text" oninput="searchProduct(this.value);" placeholder="Buscar por nombre..." class="form-control"
            id="search">
    </div>

    <table class="table w-75 mx-auto text-center table-bordered">
        <thead class="thead-dark">
            <tr>
                <th>Índice</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Descripción</th>
                <th>Editar</th>
                <th>Eliminar</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Llenado dinámicamente desde JS -->
        </tbody>
    </table>

    <script src="./js/main.js"></script>
</body>

</html>
